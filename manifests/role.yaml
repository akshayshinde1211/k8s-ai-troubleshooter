apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-ai-troubleshooter-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - replicasets
      - deployments
    verbs:
      - get
